<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="outerRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="70%" stop-color="#444"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#003a1a"/>
      <stop offset="100%" stop-color="#001a0a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="95" fill="url(#outerRing)" stroke="#555" stroke-width="2"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#666" stroke-width="1"/>
  <circle cx="100" cy="100" r="75" fill="url(#innerGlow)" stroke="#00aa55" stroke-width="1" stroke-opacity="0.5"/>
  <g stroke="#00ff88" stroke-width="1" stroke-opacity="0.6" filter="url(#glow)">
    <line x1="100" y1="100" x2="100" y2="55"/>
    <line x1="100" y1="100" x2="138" y2="68"/>
    <line x1="100" y1="100" x2="145" y2="100"/>
    <line x1="100" y1="100" x2="138" y2="132"/>
    <line x1="100" y1="100" x2="100" y2="145"/>
    <line x1="100" y1="100" x2="62"  y2="132"/>
    <line x1="100" y1="100" x2="55"  y2="100"/>
    <line x1="100" y1="100" x2="62"  y2="68"/>
    <line x1="100" y1="55"  x2="100" y2="40"/>
    <line x1="138" y1="68"  x2="150" y2="58"/>
    <line x1="145" y1="100" x2="162" y2="100"/>
    <line x1="62"  y1="68"  x2="50"  y2="58"/>
    <line x1="55"  y1="100" x2="38"  y2="100"/>
  </g>
  <g fill="#00ff88" filter="url(#glow)">
    <circle cx="100" cy="40"  r="4"/>
    <circle cx="150" cy="58"  r="3"/>
    <circle cx="162" cy="100" r="4"/>
    <circle cx="100" cy="160" r="4"/>
    <circle cx="38"  cy="100" r="4"/>
    <circle cx="50"  cy="58"  r="3"/>
  </g>
  <g fill="#00ff88" fill-opacity="0.8">
    <circle cx="100" cy="55"  r="3"/>
    <circle cx="138" cy="68"  r="3"/>
    <circle cx="145" cy="100" r="3"/>
    <circle cx="138" cy="132" r="3"/>
    <circle cx="100" cy="145" r="3"/>
    <circle cx="62"  cy="132" r="3"/>
    <circle cx="55"  cy="100" r="3"/>
    <circle cx="62"  cy="68"  r="3"/>
  </g>
  <circle cx="100" cy="100" r="12" fill="#00ff88" fill-opacity="0.2" filter="url(#strongGlow)"/>
  <circle cx="100" cy="100" r="5"  fill="#00ff88" filter="url(#strongGlow)"/>
  <circle cx="100" cy="100" r="2"  fill="#ffffff"/>
</svg>
