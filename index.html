<!doctype html>
<html lang="en">
  <head>
    <!-- Self-hosted fonts — COEP: require-corp safe -->
    <link rel="preload" href="/fonts/Inter-Regular.woff2"         as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Inter-Medium.woff2"          as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Inter-Bold.woff2"            as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/JetBrainsMono-Medium.woff2"  as="font" type="font/woff2" crossorigin>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#22d3ee"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Aivora"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aivora AI — Audio Intelligence Platform</title>
  </head>
  <body>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        document.body.innerHTML = '<div style="background:#080c14;color:#ef4444;padding:24px;font-family:monospace;min-height:100vh">' +
          '<h2 style="color:#22d3ee">AIVORA — Init Error</h2>' +
          '<p><b>Message:</b> ' + msg + '</p>' +
          '<p><b>Source:</b> ' + src + '</p>' +
          '<p><b>Line:</b> ' + line + ':' + col + '</p>' +
          '<p><b>Error:</b> ' + (err ? err.stack : 'N/A') + '</p>' +
          '</div>';
      };
      window.onunhandledrejection = function(e) {
        document.body.innerHTML = '<div style="background:#080c14;color:#ef4444;padding:24px;font-family:monospace;min-height:100vh">' +
          '<h2 style="color:#22d3ee">AIVORA — Unhandled Promise Rejection</h2>' +
          '<p>' + (e.reason ? e.reason.toString() : 'Unknown') + '</p>' +
          '<pre style="color:#f59e0b;font-size:11px">' + (e.reason && e.reason.stack ? e.reason.stack : '') + '</pre>' +
          '</div>';
      };
    </script>
    <div id="root"></div>
    <script>
      var hasOAuth = window.location.hash.includes("access_token") ||
                    window.location.hash.includes("refresh_token") ||
                    window.location.search.includes("code=");
      var params = new URLSearchParams(window.location.search);
      var enterFlag = params.get('enter') === '1' || params.get('platform') === '1';
      if(!hasOAuth && !enterFlag && window.location.pathname === "/") {
        window.location.replace("/showcase.html");
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
